name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - uses: actions/checkout@v4

      - name: Run RDP script
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: pwsh -ExecutionPolicy Bypass -File ./rdp.ps1
        
